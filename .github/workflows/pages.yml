name: Publish catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public application and all story files
        env:
          CATALOG_SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            if npm run verify:published -- --url "$CATALOG_SITE" --commit "$GITHUB_SHA"; then exit 0; fi
            sleep 10
          done
          exit 1
